server {
  # Puerto donde escucha NGINX dentro del contenedor
  listen 80;
  server_name _;   # "_" = acepta cualquier dominio o IP

  # Carpeta donde el Dockerfile copió el build de Angular
  root  /usr/share/nginx/html;
  index index.html;

  # ----------------------------------------------------------
  # Compresión gzip: los .js y .css viajan comprimidos
  # (pesan hasta 70% menos, la página carga más rápido)
  # ----------------------------------------------------------
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ----------------------------------------------------------
  # RUTAS DE ANGULAR (la solución al error de F5)
  # ----------------------------------------------------------
  # Si piden /task, NGINX busca:
  #   1. un archivo llamado "task"        ($uri)
  #   2. una carpeta llamada "task/"      ($uri/)
  #   3. si no existe nada → index.html   y Angular decide qué mostrar
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ----------------------------------------------------------
  # CACHÉ DEL NAVEGADOR
  # ----------------------------------------------------------
  # index.html NUNCA se guarda en caché: así, cuando subas una
  # nueva versión, los usuarios la ven sin tener que borrar caché.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Los .js/.css llevan hash en el nombre (main-WOOWWYAS.js).
  # Si el código cambia, cambia el nombre → se pueden cachear 1 año.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}